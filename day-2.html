<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <title>Table Assignment</title>
     <style>  

    table {
        border-collapse: collapse; 
        margin: 50px auto;
        width: 80%;
        background: #fff;
    }

    th,td {
        border: 1px dotted;
        text-align: right;
    }

    th {
        font-weight: bold;
    }

    .left {
        text-align: left;
    }
    .center{
          text-align: center;
          background-color: solid;
    }
</style>
</head>
<body>

    <table>
        <tr>
            <th rowspan="2">No</th>
            <th rowspan="2">Student Name</th>
            <th rowspan="2">Gender</th>
            <th rowspan="2">Roll No.</th>
            <th colspan="3">Marks</th>
        </tr>
        <tr>
            <th>Myanmar</th>
            <th>English</th>
            <th>Maths</th>
        </tr>

        <tr>
            <td class="center">1</td>
            <td class="left">Su Su</td>
            <td rowspan="2" class="center">Female</td>
            <td class="left">5CS-32</td>
            <td>60</td>
            <td>75</td>
            <td>86</td>
        </tr>

        <tr>
            <td class="center">2</td>
            <td class="left">Moe Moe</td>
            <td class="left">5CS-33</td>
            <td>78</td>
            <td>86</td>
            <td>84</td>
        </tr>

        <tr>
            <td class="center">3</td>
            <td class="left">Kyaw Kyaw</td>
            <td rowspan="3" class="center">Male</td>
            <td class="left">5CS-34</td>
            <td>89</td>
            <td>43</td>
            <td>86</td>
        </tr>

        <tr>
            <td class="center">4</td>
            <td class="left">Mg Mg</td>
            <td class="left">5CS-35</td>
            <td>76</td>
            <td>75</td>
            <td>75</td>
        </tr>

        <tr>
            <td class="center">5</td>
            <td class="left">Aung Aung</td>
            <td class="left">5CS-36</td>
            <td>87</td>
            <td>75</td>
            <td>86</td>
        </tr>
    </table>

</body>
</html>
